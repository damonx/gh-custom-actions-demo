name: 'Get & cache dependencies'
description: 'Get the dependencies (via npm) and cache them for future runs'
inputs:
  cacheing:
    description: 'Whether to cache dependencies or not'
    required: false
    default: 'true'
outputs:
  cache-hit:
    description: 'Whether the dependencies were cached or not'
    value: ${{ steps.install.outputs.cache }}
runs:
    using: 'composite'
    steps:
      - name: Cache dependencies
        if: inputs.cacheing == 'true'
        id: cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        id: install
        if: steps.cache.outputs.cache-hit != 'true' || inputs.cacheing != 'true'
        run: |
          npm ci
          echo "::set-output name=cache::'{{ inputs.cacheing }}'"
        shell: bash
